<title>Lion Cub Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Playfair+Display:ital,wght@1,400;1,500&family=Caveat:wght@500&display=swap">
<style>
/* Layout: MAREN's 1155x767 editorial frame (3 columns, 2 rows of hairlines) re-skinned for Lion Cub: warm cream light, cocoa ink, gold accent */
:root{
  --cream:#FDF8F0;
  --ink:#4E3324;
  --ink-soft:#6E4E3A;
  --gold:#C9973E;
  --line:rgba(78,51,36,.20);
  --glass:rgba(253,248,240,.62);
  --sans:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --u:min(calc(100vw / 1155), calc(100vh / 767));
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--cream)}
.frame{position:relative;width:calc(1155*var(--u));height:calc(767*var(--u));overflow:hidden;background:var(--cream)}
.bg{position:absolute;inset:0;width:100%;height:100%;transform-origin:58% 40%}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.mob{display:none}
.mob img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;display:block}
.rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.42;
  background:
    linear-gradient(118deg,rgba(255,244,222,0) 8%,rgba(255,244,222,.55) 16%,rgba(255,244,222,0) 24%),
    linear-gradient(118deg,rgba(255,244,222,0) 26%,rgba(255,240,214,.4) 32%,rgba(255,244,222,0) 38%),
    linear-gradient(118deg,rgba(255,244,222,0) 41%,rgba(255,240,214,.28) 45%,rgba(255,244,222,0) 50%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 95%);mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 95%)}
.motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.veil{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(253,248,240,.86) 0%,rgba(253,248,240,.55) 26%,rgba(253,248,240,0) 46%,rgba(253,248,240,0) 68%,rgba(253,248,240,.55) 82%,rgba(253,248,240,.82) 100%),
    linear-gradient(180deg,rgba(253,248,240,.55) 0%,rgba(253,248,240,0) 16%)}

.gl{position:absolute;background:var(--line);pointer-events:none}
.gv1{left:calc(200.6*var(--u));top:calc(72*var(--u));bottom:0;width:1px}
.gv2{left:calc(843.6*var(--u));top:calc(72*var(--u));bottom:0;width:1px}
.gh{top:calc(405.2*var(--u));left:0;right:0;height:1px}
.gt{top:calc(72*var(--u));left:0;right:0;height:1px}

.watermark{position:absolute;left:50%;bottom:calc(-52*var(--u));transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:calc(250*var(--u));line-height:1;letter-spacing:-.02em;color:var(--cream);opacity:.55;white-space:nowrap;pointer-events:none;z-index:1;
  text-shadow:0 0 1px rgba(78,51,36,.08)}

nav{position:absolute;left:0;right:0;top:0;height:calc(72*var(--u));display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(34*var(--u));z-index:5}
.logo{display:flex;align-items:center;gap:calc(10*var(--u));font-family:var(--serif);font-style:italic;font-weight:500;font-size:calc(28*var(--u));color:var(--ink);text-decoration:none}
.logo b{font-weight:500;color:var(--gold)}
.navr{display:flex;align-items:center;gap:calc(22*var(--u))}
.links{display:flex;align-items:center;font-size:calc(12*var(--u));letter-spacing:.14em;font-weight:500}
.links a{color:var(--ink);text-decoration:none;padding:0 calc(18*var(--u));border-left:1px solid var(--line)}
.links a:first-child{border-left:0}
.links a:hover,.links a:focus-visible{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--gold)}
.icons{display:flex;gap:calc(10*var(--u))}
.gbtn{width:calc(42*var(--u));height:calc(42*var(--u));border-radius:50%;border:1px solid rgba(78,51,36,.18);background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.gbtn svg{width:46%;height:46%}
.gbtn:focus-visible,.pill:focus-visible,.arrow:focus-visible,.links a:focus-visible,.logo:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.head{position:absolute;left:calc(34*var(--u));top:calc(104*var(--u));z-index:4}
.head h1{margin:0;font-weight:300;font-size:calc(64*var(--u));line-height:1;letter-spacing:-.025em;color:var(--ink)}
.head h1 span{display:block}
.head h1 .em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:calc(100*var(--u));letter-spacing:-.01em;line-height:1.04;margin-top:calc(2*var(--u));color:var(--gold)}

.season{position:absolute;left:calc(866*var(--u));top:calc(112*var(--u));display:flex;align-items:center;gap:calc(10*var(--u));
  font-size:calc(12*var(--u));letter-spacing:.2em;font-weight:500;z-index:4;color:var(--ink)}
.season svg{width:calc(18*var(--u));height:calc(18*var(--u));fill:var(--gold)}

.copy{position:absolute;left:calc(866*var(--u));top:calc(432*var(--u));width:calc(258*var(--u));z-index:4}
.copy p{margin:0 0 calc(22*var(--u));font-size:calc(14.5*var(--u));line-height:1.55;font-weight:400;color:var(--ink-soft)}
.cta{display:flex;align-items:center;gap:calc(10*var(--u))}
.pill{height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:999px;border:0;background:var(--ink);color:var(--cream);
  font-family:var(--sans);font-weight:500;font-size:calc(14*var(--u));cursor:pointer}
.pill:hover{background:#5f4030}
.arrow{width:calc(46*var(--u));height:calc(46*var(--u));border-radius:50%;border:1px solid rgba(78,51,36,.4);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.arrow svg{width:40%;height:40%}
.arrow:hover,.gbtn:hover{background:rgba(253,248,240,.9)}

.newc{position:absolute;left:calc(34*var(--u));top:calc(432*var(--u));font-size:calc(12*var(--u));letter-spacing:.2em;line-height:1.8;font-weight:500;z-index:4;color:var(--ink)}
.newc em{font-style:normal;color:var(--gold)}

.pola{position:absolute;left:calc(116*var(--u));top:calc(498*var(--u));width:calc(168*var(--u));background:#fff;padding:calc(10*var(--u)) calc(10*var(--u)) calc(34*var(--u));
  box-shadow:0 calc(18*var(--u)) calc(40*var(--u)) rgba(78,51,36,.22);transform:rotate(-13deg);z-index:4;margin:0}
.pola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 40%}
.pola figcaption{position:absolute;left:0;right:0;bottom:calc(5*var(--u));text-align:center;font-family:var(--hand);font-weight:500;
  color:var(--ink-soft);font-size:calc(19*var(--u))}

@media (prefers-reduced-motion:no-preference){
  .bg{animation:push 14s ease-out both}
  .rays{animation:rays 9s ease-in-out infinite alternate}
  @keyframes rays{0%{opacity:.28;transform:translateX(-1.5%)}100%{opacity:.5;transform:translateX(1.5%)}}
  .drop{animation:drop .7s cubic-bezier(.2,.7,.2,1) both}
  .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .fade{animation:fade 1s ease both}
  .pola{animation:pola 1.1s cubic-bezier(.2,.8,.25,1) 1.1s both}
  @keyframes push{from{transform:scale(1.06)}to{transform:scale(1)}}
  @keyframes drop{from{opacity:0;transform:translateY(-14px)}}
  @keyframes rise{from{opacity:0;transform:translateY(28px)}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}}
  @keyframes pola{from{opacity:0;transform:translateY(-60px) rotate(-2deg)}to{opacity:1;transform:rotate(-13deg)}}
}

/* Phones (portrait): photo covers the screen, content re-flows over it */
@media (max-aspect-ratio:3/4){
  :root{--u:calc(100vw / 400)}
  .frame{width:100vw;height:100%}
  .scene{display:none}
  .mob{display:block;position:absolute;inset:0}
  .veil{background:linear-gradient(180deg,rgba(253,248,240,.9) 0%,rgba(253,248,240,.6) 30%,rgba(253,248,240,0) 46%,rgba(253,248,240,0) 62%,rgba(253,248,240,.75) 80%,rgba(253,248,240,.95) 100%)}
  .gv1,.gv2{display:none}
  .gt{top:calc(64*var(--u))}
  .gh{top:auto;bottom:calc(196*var(--u))}
  nav{height:calc(64*var(--u));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .logo{font-size:calc(24*var(--u))}
  .links{display:none}
  .gbtn{width:calc(38*var(--u));height:calc(38*var(--u))}
  .head{left:calc(18*var(--u));top:calc(86*var(--u))}
  .head h1{font-size:calc(36*var(--u))}
  .head h1 .em{font-size:calc(58*var(--u))}
  .season,.newc{display:none}
  .copy{left:calc(18*var(--u));right:calc(18*var(--u));top:auto;bottom:calc(30*var(--u));width:auto}
  .copy p{font-size:calc(14*var(--u));max-width:32ch}
  .pill{height:calc(44*var(--u));font-size:calc(14*var(--u))}
  .arrow{width:calc(44*var(--u));height:calc(44*var(--u))}
  .pola{left:auto;right:calc(20*var(--u));top:auto;bottom:calc(214*var(--u));width:calc(96*var(--u));padding:calc(6*var(--u)) calc(6*var(--u)) calc(22*var(--u))}
  .pola figcaption{font-size:calc(13*var(--u));bottom:calc(2*var(--u))}
  .watermark{font-size:calc(120*var(--u));bottom:calc(196*var(--u))}
}
</style>

<div class="wrap">
  <main class="frame" aria-label="Lion Cub, algodón Pima peruano para bebés">
    <div class="bg">
      <svg class="scene" id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mamá sonriendo mientras sostiene a su bebé envuelto en una manta de algodón, junto a una ventana con vista al mar">
        <defs>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>

          <filter id="f-sea" filterUnits="userSpaceOnUse" x="260" y="180" width="470" height="310">
            <feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="2" seed="3" result="n">
              <animate attributeName="baseFrequency" dur="6s" values="0.004 0.09;0.005 0.11;0.004 0.09" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="f-curtain" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="840">
            <feTurbulence type="fractalNoise" baseFrequency="0.011 0.0018" numOctaves="1" seed="8" result="n">
              <animate attributeName="baseFrequency" dur="8s" values="0.011 0.0018;0.0135 0.0022;0.011 0.0018" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="B">
              <animate attributeName="scale" dur="5.5s" values="8;16;8" repeatCount="indefinite"/>
            </feDisplacementMap>
          </filter>
          <filter id="f-leaf" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="760">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n">
              <animate attributeName="baseFrequency" dur="4.5s" values="0.018;0.022;0.018" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G">
              <animate attributeName="scale" dur="3.8s" values="4;11;4" repeatCount="indefinite"/>
            </feDisplacementMap>
          </filter>
          <filter id="f-palm" filterUnits="userSpaceOnUse" x="160" y="460" width="510" height="300">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="5" result="n">
              <animate attributeName="baseFrequency" dur="5s" values="0.03;0.036;0.03" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
          </filter>

          <mask id="m-sea" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <rect x="290" y="205" width="410" height="260" fill="#fff" filter="url(#soft)"/>
          </mask>
          <mask id="m-curtain" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <rect x="0" y="0" width="175" height="820" fill="#fff" filter="url(#soft)"/>
            <rect x="1295" y="0" width="90" height="360" fill="#fff" filter="url(#soft)"/>
          </mask>
          <mask id="m-leaf" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <rect x="0" y="420" width="230" height="310" fill="#fff" filter="url(#soft)"/>
            <rect x="1420" y="0" width="500" height="290" fill="#fff" filter="url(#soft)"/>
          </mask>
          <mask id="m-palm" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <rect x="180" y="480" width="470" height="260" fill="#fff" filter="url(#soft)"/>
          </mask>
        </defs>
        <image href="../../public/hero/poster-desktop.webp" x="0" y="0" width="1920" height="1080"/>
        <g mask="url(#m-sea)"><image class="fx" href="../../public/hero/poster-desktop.webp" x="0" y="0" width="1920" height="1080" filter="url(#f-sea)"/></g>
        <g mask="url(#m-palm)"><image class="fx" href="../../public/hero/poster-desktop.webp" x="0" y="0" width="1920" height="1080" filter="url(#f-palm)"/></g>
        <g mask="url(#m-curtain)"><image class="fx" href="../../public/hero/poster-desktop.webp" x="0" y="0" width="1920" height="1080" filter="url(#f-curtain)"/></g>
        <g mask="url(#m-leaf)"><image class="fx" href="../../public/hero/poster-desktop.webp" x="0" y="0" width="1920" height="1080" filter="url(#f-leaf)"/></g>
      </svg>
      <picture class="mob">
        <img src="../../public/hero/poster-mobile.webp" alt="Mamá sonriendo mientras sostiene a su bebé envuelto en una manta de algodón">
      </picture>
      <div class="rays" aria-hidden="true"></div>
      <canvas class="motes" id="motes" aria-hidden="true"></canvas>
    </div>
    <div class="veil"></div>

    <div class="watermark" aria-hidden="true">Lion Cub</div>

    <div class="gl gt"></div><div class="gl gv1"></div><div class="gl gv2"></div><div class="gl gh"></div>

    <nav>
      <a class="logo drop" href="#inicio" style="animation-delay:.05s">Lion <b>Cub</b></a>
      <div class="navr">
        <div class="links drop" style="animation-delay:.15s">
          <a href="#coleccion">COLECCIÓN</a><a href="#pima">ALGODÓN PIMA</a><a href="#nosotros">NOSOTROS</a>
        </div>
        <div class="icons drop" style="animation-delay:.25s">
          <button class="gbtn" id="fav" type="button" aria-label="Favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
          <button class="gbtn" id="bag" type="button" aria-label="Carrito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
        </div>
      </div>
    </nav>

    <div class="head">
      <h1>
        <span class="rise" style="animation-delay:.35s">Suave como</span>
        <span class="rise" style="animation-delay:.5s">la caricia de</span>
        <span class="em rise" style="animation-delay:.65s">mamá</span>
      </h1>
    </div>

    <div class="season drop" style="animation-delay:.45s">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.6 6.6 5.4 11.4 12 12-6.6.6-11.4 5.4-12 12-.6-6.6-5.4-11.4-12-12C6.6 11.4 11.4 6.6 12 0z"/></svg>
      VERANO 2027
    </div>

    <div class="newc fade" style="animation-delay:.9s">NUEVA<br>COLECCIÓN<br><em>0 – 24 MESES</em></div>

    <div class="copy fade" style="animation-delay:.95s">
      <p>Algodón Pima peruano de fibra extra larga: suave, ligero y hecho para durar. Prendas para cada siesta, cada abrazo y cada primera vez.</p>
      <div class="cta">
        <button class="pill" id="ver" type="button">Ver colección</button>
        <button class="arrow" id="ir" type="button" aria-label="Ir a la colección"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></button>
      </div>
    </div>

    <figure class="pola">
      <img src="../../public/lc-imgs/p0.webp" alt="Bebé sentado con body blanco de perrito bordado, pantalón estampado y gorro azul">
      <figcaption>Set Perrito</figcaption>
    </figure>
  </main>
</div>

<script>
(function(){
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = document.getElementById('scene');
  if (reduced){
    try { svg.pauseAnimations(); } catch(e){}
    document.querySelectorAll('.fx').forEach(function(el){ el.removeAttribute('filter'); });
    return;
  }
  var cv = document.getElementById('motes'), ctx = cv.getContext('2d');
  var W=0, H=0, dpr=Math.min(window.devicePixelRatio||1, 2), motes=[];
  function size(){
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mk(initial){
    var inBeam = Math.random() < .7;
    return {
      x: (inBeam ? Math.random()*.55 : Math.random()) * W,
      y: initial ? Math.random()*H : H*(.35+Math.random()*.6),
      r: .6 + Math.random()*2.2,
      vx: .05 + Math.random()*.18,
      vy: -(.03 + Math.random()*.12),
      ph: Math.random()*6.28,
      a: .25 + Math.random()*.5
    };
  }
  function init(){ size(); motes=[]; var n = Math.round(Math.min(70, W/18)); for (var i=0;i<n;i++) motes.push(mk(true)); }
  var last = performance.now();
  function frame(t){
    var dt = Math.min(48, t-last)/16.7; last = t;
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<motes.length;i++){
      var m = motes[i];
      m.ph += .012*dt;
      m.x += (m.vx + Math.sin(m.ph)*.12)*dt;
      m.y += (m.vy + Math.cos(m.ph*.7)*.06)*dt;
      if (m.x > W+10 || m.y < -10) { motes[i] = mk(false); continue; }
      var beam = Math.max(0, 1 - m.x/(W*.7));
      var g = ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*3);
      g.addColorStop(0,'rgba(255,250,240,'+(m.a*(.45+.55*beam)).toFixed(3)+')');
      g.addColorStop(1,'rgba(255,250,240,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r*3,0,6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  init();
  window.addEventListener('resize', init);
  requestAnimationFrame(frame);
})();
</script>
